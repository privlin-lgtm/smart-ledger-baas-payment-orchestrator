name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:api
      - run: npm run build:web
      - run: npm audit --audit-level=high

  test-api:
    runs-on: ubuntu-latest
    # The integration tests write permanent append-only rows, so they run against a throwaway
    # local Supabase stack started inside this job (Docker on the runner). No remote Supabase
    # project and no secrets are involved; the stack is gone when the job ends.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - run: npm ci
      - name: Start local Supabase and apply supabase/migrations
        # Only the database, PostgREST, Auth (for the service-role key) and the Kong gateway
        # are needed. `supabase start` applies every file in supabase/migrations in order.
        run: supabase start -x studio,imgproxy,mailpit,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Write api/.env.test from the local stack
        run: |
          supabase status -o env --agent no \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY)=' > api/.env.test
          echo 'API_KEY="ci-local-test-key"' >> api/.env.test
          grep -q '^SUPABASE_URL="http://127.0.0.1:' api/.env.test
          grep -q '^SUPABASE_SERVICE_ROLE_KEY=' api/.env.test
      - run: npm test --workspace=api
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
